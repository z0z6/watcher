name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "tools/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Wygeneruj szkielet Androida (kod z lib/ i pubspec.yaml zostaje nasz)
        run: |
          cp -r lib /tmp/lib_backup && cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org pl.watchpl --project-name watchpl .
          rm -rf lib test && cp -r /tmp/lib_backup lib && cp /tmp/pubspec_backup.yaml pubspec.yaml
      - name: Uprawnienia i desugaring
        run: python3 ../tools/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: watchpl-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
